services:
  db:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: courses
      POSTGRES_PASSWORD: courses
      POSTGRES_DB: courses
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courses -d courses"]
      interval: 2s
      timeout: 3s
      retries: 30

  # เว็บแบบ container: docker compose --profile app up -d
  # (ไม่ใส่ --profile จะเปิดแค่ฐานข้อมูล สำหรับ npm run dev)
  app:
    profiles: ["app"]
    image: ghcr.io/eadsrichai/subject:latest
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://courses:courses@db:5432/courses
      AUTH_SECRET: ${AUTH_SECRET:?ต้องกำหนด AUTH_SECRET ใน .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

volumes:
  pgdata:
